name: Build APK (ABI) + macOS Release

# 一个 Release 同时交付：Android 按 ABI 拆分的 APK + macOS (Apple Silicon) 安装包。
# 触发：推送 mobile-v* 标签，或在 Actions 页手动运行。
# 说明：不使用 v* 前缀，避免触发仓库里既有的 release.yml / build-linux.yml / build-ios.yml。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签（留空 = mobile-v<版本号>）"
        required: false
        default: ""
      macos_arch:
        description: "macOS 架构"
        required: false
        default: "arm64"
        type: choice
        options:
          - arm64
          - x64
          - universal
  push:
    tags: ["mobile-v*"]
    # 仅用于失败后重跑：不新建 tag，产物会补进已有的 mobile-v<版本> Release
    branches: ["ci-rerun"]

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  # ==================== Android：按 ABI 拆分 + 签名 ====================
  android:
    name: Android (split per ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "构建版本: $V"

      - name: 释放 runner 磁盘空间
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$ANDROID_HOME/system-images" 2>/dev/null || true
          df -h /

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK；sdkmanager 的 license 交互用 yes 管道吞掉
      - name: 准备 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;28.2.13676358"
          # build.rs 优先读 NDK_HOME，Tauri 读 ANDROID_NDK_HOME；两者必须指向同一个 NDK，
          # 否则 bindgen 的 --sysroot 与实际编译用的 sysroot 会错配。
          NDK="$SDK/ndk/28.2.13676358"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          ls -1 "$SDK/ndk"

      # hpp crate 在 Android target 上让 rquickjs 走 bindgen，生成绑定需要 libclang
      - name: 安装 clang / libclang（bindgen 依赖）
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev llvm-dev
          echo "LIBCLANG_PATH=$(llvm-config --libdir 2>/dev/null || echo /usr/lib/llvm-18/lib)" >> "$GITHUB_ENV"
          clang --version | head -1

      # NDK 27+ 的 sysroot/usr/include/sys/cdefs.h 拒绝不带 API level 的 target triple：
      #   "Unversioned target triples are not supported!"
      # vendor/rquickjs-sys/build.rs 的 Android 分支只传了 --sysroot 和 -resource-dir，
      # bindgen 会沿用 cargo 的裸 triple（aarch64-linux-android），于是在生成绑定时 panic。
      # 这里补上 __ANDROID_API__ 和带版本号的 --target；上游没有 Android CI，只能在 fork 修。
      - name: 为 bindgen 指定带 API level 的 Android target
        shell: bash
        run: |
          set -euo pipefail
          API=24
          COMMON="-D__ANDROID_API__=$API"
          echo "BINDGEN_EXTRA_CLANG_ARGS=$COMMON" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android$API $COMMON" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7a-linux-androideabi$API $COMMON" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK_HOME:-unset}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
          echo "bindgen Android API level = $API"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-abi

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 构建 APK（按 ABI 拆分）
        shell: bash
        run: |
          set +e
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 2>&1 | tee /tmp/android-build.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            python3 -c "import re; t=open('/tmp/android-build.log',errors='replace').read().splitlines(); l=[x for x in t if re.search(r'error|failed|panic|not found|cannot|ERROR|FAILED|undefined',x)]; s='\n'.join((l[-40:] if l else t[-40:]))[-6000:]; print('::error title=Android build failed::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            echo "::error::完整日志已打印在上方步骤输出中（截取最后 40 条关键行）"
            exit "$RC"
          fi

      - name: 签名并整理 APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set +e
          {
            set -euo pipefail
            SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            echo "Android SDK = $SDK"
            echo "=== build-tools ==="
            ls -1 "$SDK/build-tools"
            echo "=== APK 产物树 ==="
            find src-tauri/gen/android -type f -name '*.apk' | sort

            KS="$RUNNER_TEMP/hghub-release.keystore"
            SUFFIX=""
            if [ -n "${KEYSTORE_BASE64:-}" ]; then
              echo "使用仓库固定发布密钥签名"
              echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
              ALIAS="${KEY_ALIAS:-hghub}"
              SP="$STORE_PASSWORD"
              KP="$KEY_PASSWORD"
            else
              echo "::warning::未配置 ANDROID_KEY_* secrets，改用本次 CI 临时密钥签名；APK 可安装，但不同批次签名不同"
              ALIAS="hghub-ci"
              SP="hghub-ci-store"
              # Java 17 默认生成 PKCS12，它不支持 store/key 两个不同密码：
              # keytool 会忽略 -keypass，但 apksigner 仍用 --key-pass 解私钥 -> BadPaddingException。
              KP="$SP"
              keytool -genkeypair -keystore "$KS" -alias "$ALIAS" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$SP" -keypass "$KP" \
                -dname "CN=HGhub CI, OU=CI, O=HGhub, L=Shanghai, ST=Shanghai, C=CN"
              SUFFIX="_ci-signed"
            fi

            BT_DIR="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            APKSIGNER="$BT_DIR/apksigner"
            test -x "$APKSIGNER" || { echo "apksigner 不可执行: $APKSIGNER"; exit 1; }
            echo "apksigner = $APKSIGNER"

            mkdir -p artifacts
            mapfile -t APK_FILES < <(find src-tauri/gen/android -type f -name '*.apk' | sort)
            found=0
            for f in "${APK_FILES[@]}"; do
              case "$f" in *debug*) continue ;; esac
              raw=""
              for seg in $(printf '%s' "$f" | tr '/' ' '); do
                case "$seg" in
                  arm64|arm|x86_64|x86|arm64-v8a|armeabi-v7a|universal) raw="$seg"; break ;;
                esac
              done
              [ -n "$raw" ] || raw="$(basename "$(dirname "$f")")"
              case "$raw" in
                arm64|arm64-v8a) abi="arm64-v8a" ;;
                arm|armeabi-v7a) abi="armeabi-v7a" ;;
                x86_64)          abi="x86_64" ;;
                x86)             abi="x86" ;;
                *)               abi="$raw" ;;
              esac
              out="artifacts/HGhub_${VERSION}_android_${abi}${SUFFIX}.apk"
              echo "签名 $f -> $out (ABI=$abi)"
              "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$ALIAS" \
                --ks-pass "pass:$SP" --key-pass "pass:$KP" \
                --v4-signing-enabled false --out "$out" "$f"
              # 不要直接 | head：pipefail 下 head 提前关闭管道会误判为失败。
              "$APKSIGNER" verify --print-certs "$out" > /tmp/apksigner-verify.txt 2>&1 || {
                cat /tmp/apksigner-verify.txt; exit 1; }
              head -3 /tmp/apksigner-verify.txt
              found=$((found + 1))
            done
            rm -f "$KS"
            if [ "$found" -eq 0 ]; then
              echo "没有找到可签名的 release APK"; exit 1
            fi
            ls -lh artifacts
          } 2>&1 | tee /tmp/sign.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            python3 -c "t=open('/tmp/sign.log',errors='replace').read().splitlines(); s='\n'.join(t[-45:])[-6000:]; print('::error title=APK 签名失败::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit "$RC"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-abi
          path: artifacts/*
          if-no-files-found: error

  # ==================== macOS：dmg + app.tar.gz ====================
  macos:
    name: macOS (${{ inputs.macos_arch || 'arm64' }})
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号与架构
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          ARCH="${{ inputs.macos_arch }}"
          if [ -z "$ARCH" ]; then ARCH="arm64"; fi
          case "$ARCH" in
            arm64)     TARGET="aarch64-apple-darwin" ;;
            x64)       TARGET="x86_64-apple-darwin" ;;
            universal) TARGET="universal-apple-darwin" ;;
            *)         TARGET="aarch64-apple-darwin"; ARCH="arm64" ;;
          esac
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "构建版本 $V / macOS $ARCH ($TARGET)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ steps.ver.outputs.arch }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 显式重建前端：不依赖 beforeBuildCommand，并把产物哈希记录下来供后面自检。
      - name: 构建前端（dist）
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          JS="$(ls dist/assets/index-*.js | head -1)"
          echo "dist JS: $(basename "$JS")"
          echo "DIST_JS=$(basename "$JS")" >> "$GITHUB_ENV"

      # swatinem/rust-cache 命中时 tauri-build 可能不重跑，导致二进制里嵌的还是旧前端资源。
      # 清掉本 crate 的构建产物，强制重跑 build.rs 重新嵌入 dist。
      - name: 强制重新嵌入前端资源
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p huangguo-client

      - name: 构建 macOS 应用（dmg + app）
        run: pnpm tauri build --config src-tauri/tauri.macos.conf.json --target ${{ steps.ver.outputs.target }}

      # 自检：二进制里嵌入的 JS 必须与刚构建的 dist 一致，否则直接失败而不是发出旧包。
      - name: 校验前端资源已嵌入最新构建
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find src-tauri/target -type f -name 'huangguo-client' -path '*release*' | head -1)"
          if [ -z "$BIN" ]; then echo "::error::未找到可执行文件"; exit 1; fi
          APP_JS="$(strings -a "$BIN" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 | xargs -n1 basename)"
          echo "二进制 JS: $APP_JS / dist JS: $DIST_JS"
          if [ "$APP_JS" != "$DIST_JS" ]; then
            echo "::error::前端资源未更新（二进制=$APP_JS dist=$DIST_JS）"
            exit 1
          fi

      - name: 整理产物
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          A="${{ steps.ver.outputs.arch }}"
          mkdir -p artifacts
          DMG="$(find src-tauri/target -type f -name '*.dmg' | head -1)"
          APP="$(find src-tauri/target -type d -name 'HGhub.app' | head -1)"
          if [ -z "$DMG" ]; then echo "::error::未找到 DMG"; exit 1; fi
          echo "发现 DMG: $DMG"
          cp "$DMG" "artifacts/HGhub_${V}_macos_${A}.dmg"
          if [ -n "$APP" ]; then
            echo "发现 APP: $APP"
            tar -czf "artifacts/HGhub_${V}_macos_${A}.app.tar.gz" \
              -C "$(dirname "$APP")" "HGhub.app"
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.ver.outputs.arch }}
          path: artifacts/*
          if-no-files-found: error

  # ==================== 发布 ====================
  publish:
    name: Publish GitHub Release
    needs: [android, macos]
    # 任一侧成功即发布已有产物，避免早期版本单点失败导致完全无包
    if: always() && (needs.android.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 计算 Release 标签
        id: meta
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          T="${{ inputs.tag }}"
          if [ -z "$T" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              T="$GITHUB_REF_NAME"
            else
              T="mobile-v$V"
            fi
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "android=${{ needs.android.result }}" >> "$GITHUB_OUTPUT"
          echo "macos=${{ needs.macos.result }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 校验产物
        run: |
          ls -lh artifacts
          test -n "$(find artifacts -type f -print -quit)" || {
            echo "::error::没有可发布的产物"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HGhub ${{ steps.meta.outputs.version }} · Android (ABI) + macOS
          body: |
            ## HGhub v${{ steps.meta.outputs.version }} 构建发布

            基于 `conradlyn/HGhub-new`（源 `Minireel/HGhub`）的自动构建产物。

            ### 产物
            - **Android**：按 ABI 拆分的 APK——`arm64-v8a`（主流新机）与 `armeabi-v7a`（旧 32 位设备）。
            - **macOS**：`dmg` 安装包与 `.app.tar.gz` 绿色压缩包。

            ### 签名说明
            - 若仓库配置了 `ANDROID_KEY_*` secrets，APK 使用固定发布密钥签名，可跨版本直接升级。
            - 若未配置（当前早期构建常见），APK 文件名带 `_ci-signed`，使用本次 CI 临时密钥签名：
              可直接安装，但不同批次之间**不能直接覆盖升级**，需先卸载旧版。
            - macOS 为 ad-hoc 签名、未公证。首次打开若被拦截，可执行：
              `sudo xattr -rd com.apple.quarantine /Applications/HGhub.app`

            ### 本次构建结果
            - Android job: `${{ steps.meta.outputs.android }}`
            - macOS job: `${{ steps.meta.outputs.macos }}`

            应用本身不内置内容源，首次使用需在「插件中心 → 导入与订阅」自行导入插件。
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
